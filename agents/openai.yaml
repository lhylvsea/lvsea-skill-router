interface:
  display_name: "lvsea-skill-router"
  short_description: "统一路由 Skill；可选择先展示候选并等待确认"
  default_prompt: "Use $lvsea-skill-router to choose the smallest correct Skill set. If the user asks to confirm first, stop after reranking and wait for an explicit continue."

dependencies:
  tools:
    - type: "mcp"
      value: "jev"
      description: "Optional TypeSafe Jev MCP for semantic reranking and final routing decisions."
      transport: "stdio"

policy:
  allow_implicit_invocation: false
